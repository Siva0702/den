services:
  - type: web
    name: den-quant-scanner
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python models/auto_scanner.py
    plan: free
    healthCheckPath: /
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: PYTHON_VERSION
        value: 3.10.12
